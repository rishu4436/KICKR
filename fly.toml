# Fly.io deploy skeleton for KICKR public DEMO.
# Set secrets via `fly secrets set` — never commit them.
# Required secrets: DATABASE_URL, REDIS_URL, APPROVED_ATTESTORS,
# DEMO_CONTROL_TOKEN (optional ops), ALLOWED_ORIGINS matching the public URL.
app = "kickr-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SPORTS_PROVIDER = "DEMO"
  DEMO_SEED_ENABLED = "false"
  SOLANA_CLUSTER = "devnet"
  PORT = "3000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/ready/demo"
